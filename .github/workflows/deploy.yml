
name: Deploy Sham Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_WHATSAPP: ${{ vars.VITE_PUBLIC_WHATSAPP }}
          VITE_PUBLIC_EMAIL: ${{ vars.VITE_PUBLIC_EMAIL }}
          VITE_PLATFORM_LOGIN_URL: ${{ vars.VITE_PLATFORM_LOGIN_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
